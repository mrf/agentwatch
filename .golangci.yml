# golangci-lint v2 config. CI pins the version in .github/workflows/ci.yml.
#
# Policy: start from the `standard` set (errcheck, govet, ineffassign,
# staticcheck, unused) and add every bug-finding / API-hygiene linter we can
# keep green. Style- and metric-only linters stay off; each omission is listed
# below with its reason so the next reader can tell "deliberately off" from
# "never considered". Per-lint exceptions live in `exclusions.rules`.
version: "2"

run:
  tests: true

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - gosec
    - gosmopolitan
    - makezero
    - misspell
    - modernize
    - musttag
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - predeclared
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace

  # Deliberately NOT enabled (golangci-lint `default: all` minus these):
  #   wsl, wsl_v5, nlreturn, whitespace-adjacent layout linters, lll, godot,
  #   gofumpt-style formatters — pure formatting taste; gofmt is the gate.
  #   exhaustruct, varnamelen, paralleltest, testpackage, noinlineerr, mnd,
  #   nonamedreturns, funcorder, godox, forbidigo, tagliatelle, ireturn,
  #   depguard — opinionated style / need a per-repo policy this repo has not
  #   adopted. tagliatelle in particular would force JSON-tag renames on the
  #   public wire format.
  #   cyclop, gocognit, gocyclo, funlen, nestif, maintidx — complexity
  #   metrics; ~45 existing functions exceed the defaults and fixing them is
  #   refactoring, not lint hygiene. Tracked as a separate ticket.
  #   err113, wrapcheck — would demand sentinel/wrapped errors on ~60 call
  #   sites; tracked as a separate ticket.
  #   intrange — CLAUDE.md design rule 8 mandates classic `for i := 0; ...`
  #   loops (modernize's rangeint is disabled below for the same reason).
  #   gochecknoglobals — package-level tables and test fixtures are
  #   idiomatic here; the handful of mutable globals are reviewed by hand.

  settings:
    modernize:
      disable:
        - rangeint # CLAUDE.md design rule 8: no range-over-integer.
        - omitzero # omitempty -> omitzero changes the public JSON wire format (zero structs would vanish).
    gosec:
      excludes:
        - G304 # file paths come from caller-configured session directories; reading them is the library's purpose.
    revive:
      rules:
        - name: exported
          disabled: true # stutter check (session.SessionState etc.) flags the public API; renaming is a breaking change.

  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec # fixtures write world-readable temp files and use fixed test tokens.
          - bodyclose # httptest handlers and short-lived test servers; the server teardown closes the connections.
          - noctx # test requests against httptest servers do not need cancellation.
          - goconst # repeated fixture strings are clearer inline.
          - unparam # test helpers keep a uniform signature.
          - forcetypeassert # a failed assertion in a test panics, which is the desired failure.
      - path: internal/testutil/
        linters:
          - thelper # helpers take `t testing.TB`; renaming to `tb` is churn.
